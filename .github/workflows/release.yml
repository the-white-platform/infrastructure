name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/**'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-skip:
    name: Check if CI should be skipped
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check commit message
        id: check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message || github.event.commits[0].message }}"
          if echo "$COMMIT_MSG" | grep -qiE "\[skip ci\]|\[ci skip\]|\[skip actions\]|\[actions skip\]"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️  CI/CD skipped due to commit message"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ CI/CD will run"
          fi

  release:
    needs: check-skip
    if: needs.check-skip.outputs.skip != 'true'
    name: Bump Version
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          installation-id: ${{ secrets.RELEASE_BOT_INSTALLATION_ID }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}

      - name: Check if release commit
        id: check
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qE "^chore\(release\):"; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "ℹ️  This is a release commit, skipping version bump"
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "✅ Will bump version"
          fi

      - name: Setup Node.js
        if: steps.check.outputs.is_release == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.check.outputs.is_release == 'false'
        run: npm install

      - name: Configure Git
        if: steps.check.outputs.is_release == 'false'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Generate changelog and bump version
        if: steps.check.outputs.is_release == 'false'
        id: release
        run: |
          export HUSKY=0
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          COMMITS=$(if [ -n "$LAST_TAG" ]; then git log ${LAST_TAG}..HEAD --oneline --grep="^chore(release):" --invert-grep || echo ""; else git log --oneline --grep="^chore(release):" --invert-grep || echo ""; fi)
          if [ -z "$COMMITS" ]; then
            echo "needs_release=false" >> $GITHUB_ENV
            echo "ℹ️  No commits to release"
            exit 0
          fi
          if echo "$COMMITS" | grep -qiE "BREAKING"; then
            npx standard-version --release-as major --skip.commit --skip.tag
          elif echo "$COMMITS" | grep -qiE "^[a-f0-9]+.*feat"; then
            npx standard-version --release-as minor --skip.commit --skip.tag
          else
            npx standard-version --release-as patch --skip.commit --skip.tag
          fi
          NEW_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "")
          if [ -z "$NEW_VERSION" ] || [ "$NEW_VERSION" = "null" ]; then
            echo "❌ Error: Failed to get version"
            exit 1
          fi
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "needs_release=true" >> $GITHUB_ENV

      - name: Commit version and changelog
        if: steps.check.outputs.is_release == 'false' && env.needs_release == 'true'
        run: |
          git add package.json CHANGELOG.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): ${{ steps.release.outputs.version }}"
            git push origin main
            echo "✅ Version bumped to ${{ steps.release.outputs.version }}"
          fi

      - name: Create and push git tag
        if: steps.check.outputs.is_release == 'false' && env.needs_release == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git tag -a "v${{ steps.release.outputs.version }}" -m "chore(release): ${{ steps.release.outputs.version }}"
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git "v${{ steps.release.outputs.version }}"
          echo "✅ Tag v${{ steps.release.outputs.version }} created and pushed"

