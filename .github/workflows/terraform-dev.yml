name: Terraform - Dev

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-dev.yml'
  push:
    branches:
      - main
    tags-ignore:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/create-release.yml'
      - '.github/workflows/terraform-prod.yml'

concurrency:
  group: terraform-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  check-skip:
    name: Check if CI should be skipped
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check commit message
        id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMIT_MSG="${{ github.event.pull_request.title }}"
          else
            COMMIT_MSG="${{ github.event.head_commit.message || github.event.commits[0].message }}"
          fi
          if echo "$COMMIT_MSG" | grep -qiE "\[skip ci\]|\[ci skip\]|\[skip actions\]|\[actions skip\]"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️  CI/CD skipped due to commit message"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ CI/CD will run"
          fi

  terraform-plan-pr:
    name: Terraform Plan (PR)
    runs-on: ubuntu-latest
    needs: check-skip
    if: github.event_name == 'pull_request' && needs.check-skip.outputs.skip != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_DEV }}
          create_credentials_file: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Import existing WIF resources if not in state
        working-directory: terraform/environments/dev
        continue-on-error: true
        run: |
          PROJECT_ID="the-white-dev-481217"
          POOL_ID="github-pool"
          PROVIDER_ID="github-provider"
          
          # Get project number
          PROJECT_NUMBER=$(gcloud projects describe "$PROJECT_ID" --format="value(projectNumber)")
          
          # Import pool if it exists and not in state
          POOL_NAME="projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/${POOL_ID}"
          if gcloud iam workload-identity-pools describe "$POOL_ID" \
            --project="$PROJECT_ID" \
            --location="global" \
            --format="value(name)" > /dev/null 2>&1; then
            terraform import google_iam_workload_identity_pool.github_actions_pool "$POOL_NAME" 2>/dev/null || \
              echo "ℹ️  Pool already in state or import failed"
          fi
          
          # Import provider if it exists and not in state
          PROVIDER_NAME="projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/${POOL_ID}/providers/${PROVIDER_ID}"
          if gcloud iam workload-identity-pools providers describe "$PROVIDER_ID" \
            --project="$PROJECT_ID" \
            --location="global" \
            --workload-identity-pool="$POOL_ID" \
            --format="value(name)" > /dev/null 2>&1; then
            terraform import google_iam_workload_identity_pool_provider.github_actions_provider "$PROVIDER_NAME" 2>/dev/null || \
              echo "ℹ️  Provider already in state or import failed"
          fi

      - name: Terraform Plan
        working-directory: terraform/environments/dev
        run: terraform plan -var-file=terraform.tfvars

  terraform-apply:
    name: Terraform Plan & Apply (Release)
    runs-on: ubuntu-latest
    needs: check-skip
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-skip.outputs.skip != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if release commit
        id: check
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit: $COMMIT_MSG"
          if echo "$COMMIT_MSG" | grep -qE "^chore\(release\):"; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "✅ Release commit detected"
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Not a release commit, skipping"
          fi

      - name: Authenticate to Google Cloud
        if: steps.check.outputs.is_release == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_DEV }}
          create_credentials_file: true

      - name: Set up Cloud SDK
        if: steps.check.outputs.is_release == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        if: steps.check.outputs.is_release == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        if: steps.check.outputs.is_release == 'true'
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Remove stale lock
        if: steps.check.outputs.is_release == 'true'
        working-directory: terraform/environments/dev
        continue-on-error: true
        run: |
          LOCK_FILE="gs://the-white-platform-terraform-state-dev-481217/terraform/state/dev/default.tflock"
          if gsutil stat "$LOCK_FILE" &>/dev/null; then
            gsutil rm "$LOCK_FILE" 2>/dev/null && echo "✅ Stale lock removed" || echo "ℹ️  Lock in use"
          fi

      - name: Import existing WIF resources if not in state
        if: steps.check.outputs.is_release == 'true'
        working-directory: terraform/environments/dev
        continue-on-error: true
        run: |
          set -e
          PROJECT_ID="the-white-dev-481217"
          POOL_ID="github-pool"
          PROVIDER_ID="github-provider"
          
          # Get project number
          PROJECT_NUMBER=$(gcloud projects describe "$PROJECT_ID" --format="value(projectNumber)")
          echo "📋 Project: $PROJECT_ID (Number: $PROJECT_NUMBER)"
          
          # Check if pool exists in GCP
          POOL_NAME="projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/${POOL_ID}"
          if gcloud iam workload-identity-pools describe "$POOL_ID" \
            --project="$PROJECT_ID" \
            --location="global" \
            --format="value(name)" > /dev/null 2>&1; then
            echo "✅ Pool exists in GCP: $POOL_NAME"
            # Check if already in state
            if terraform state show google_iam_workload_identity_pool.github_actions_pool > /dev/null 2>&1; then
              echo "ℹ️  Pool already in Terraform state"
            else
              echo "📥 Importing pool into Terraform state..."
              terraform import google_iam_workload_identity_pool.github_actions_pool "$POOL_NAME" || \
                echo "⚠️  Pool import failed (may already be in state)"
            fi
          else
            echo "ℹ️  Pool does not exist in GCP, will be created by Terraform"
          fi
          
          # Check if provider exists in GCP
          PROVIDER_NAME="projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/${POOL_ID}/providers/${PROVIDER_ID}"
          if gcloud iam workload-identity-pools providers describe "$PROVIDER_ID" \
            --project="$PROJECT_ID" \
            --location="global" \
            --workload-identity-pool="$POOL_ID" \
            --format="value(name)" > /dev/null 2>&1; then
            echo "✅ Provider exists in GCP: $PROVIDER_NAME"
            # Check if already in state
            if terraform state show google_iam_workload_identity_pool_provider.github_actions_provider > /dev/null 2>&1; then
              echo "ℹ️  Provider already in Terraform state"
            else
              echo "📥 Importing provider into Terraform state..."
              terraform import google_iam_workload_identity_pool_provider.github_actions_provider "$PROVIDER_NAME" || \
                echo "⚠️  Provider import failed (may already be in state)"
            fi
          else
            echo "ℹ️  Provider does not exist in GCP, will be created by Terraform"
          fi

      - name: Terraform Plan
        if: steps.check.outputs.is_release == 'true'
        working-directory: terraform/environments/dev
        run: terraform plan -var-file=terraform.tfvars -out=tfplan

      - name: Terraform Apply
        if: steps.check.outputs.is_release == 'true'
        working-directory: terraform/environments/dev
        run: terraform apply -auto-approve tfplan

      - name: Terraform Output
        if: steps.check.outputs.is_release == 'true'
        working-directory: terraform/environments/dev
        run: terraform output

