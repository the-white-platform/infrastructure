name: Terraform - Prod

on:
  push:
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'README.md'
      - 'CHANGELOG.md'

concurrency:
  group: terraform-prod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  check-skip:
    name: Check if CI should be skipped
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check commit message
        id: check
        run: |
          # For tag pushes, check the commit message of the tag
          TAG_SHA=$(git rev-parse ${{ github.ref_name }})
          COMMIT_MSG=$(git log -1 --pretty=%B $TAG_SHA)
          if echo "$COMMIT_MSG" | grep -qiE "\[skip ci\]|\[ci skip\]|\[skip actions\]|\[actions skip\]"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️  CI/CD skipped due to commit message"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ CI/CD will run"
          fi

  terraform-apply:
    needs: check-skip
    if: needs.check-skip.outputs.skip != 'true'
    name: Terraform Apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_PROD }}
          create_credentials_file: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        working-directory: terraform/environments/prod
        run: terraform init

      - name: Remove stale lock
        working-directory: terraform/environments/prod
        continue-on-error: true
        run: |
          LOCK_FILE="gs://the-white-prod-terraform-state-481217/terraform/state/prod/default.tflock"
          if gsutil stat "$LOCK_FILE" &>/dev/null; then
            gsutil rm "$LOCK_FILE" 2>/dev/null && echo "✅ Stale lock removed" || echo "ℹ️  Lock in use"
          fi

      - name: Import existing WIF resources if not in state
        working-directory: terraform/environments/prod
        continue-on-error: true
        run: |
          PROJECT_ID="the-white-prod-481217"
          POOL_ID="github-pool"
          PROVIDER_ID="github-provider"
          
          # Get project number
          PROJECT_NUMBER=$(gcloud projects describe "$PROJECT_ID" --format="value(projectNumber)")
          echo "📋 Project: $PROJECT_ID (Number: $PROJECT_NUMBER)"
          
          # Check if pool exists in GCP
          POOL_NAME="projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/${POOL_ID}"
          if gcloud iam workload-identity-pools describe "$POOL_ID" \
            --project="$PROJECT_ID" \
            --location="global" \
            --format="value(name)" > /dev/null 2>&1; then
            echo "✅ Pool exists in GCP: $POOL_NAME"
            # Check if already in state - use state list which is more reliable
            if terraform state list | grep -q "google_iam_workload_identity_pool.github_actions_pool"; then
              echo "ℹ️  Pool already in Terraform state"
            else
              echo "📥 Importing pool into Terraform state..."
              terraform import google_iam_workload_identity_pool.github_actions_pool "$POOL_NAME" 2>&1
              if [ $? -eq 0 ]; then
                echo "✅ Pool imported successfully"
              else
                echo "⚠️  Pool import failed, but continuing..."
              fi
            fi
          else
            echo "ℹ️  Pool does not exist in GCP, will be created by Terraform"
          fi
          
          # Check if provider exists in GCP
          PROVIDER_NAME="projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/${POOL_ID}/providers/${PROVIDER_ID}"
          if gcloud iam workload-identity-pools providers describe "$PROVIDER_ID" \
            --project="$PROJECT_ID" \
            --location="global" \
            --workload-identity-pool="$POOL_ID" \
            --format="value(name)" > /dev/null 2>&1; then
            echo "✅ Provider exists in GCP: $PROVIDER_NAME"
            # Check if already in state - use state list which is more reliable
            if terraform state list | grep -q "google_iam_workload_identity_pool_provider.github_actions_provider"; then
              echo "ℹ️  Provider already in Terraform state"
            else
              echo "📥 Importing provider into Terraform state..."
              IMPORT_OUTPUT=$(terraform import google_iam_workload_identity_pool_provider.github_actions_provider "$PROVIDER_NAME" 2>&1)
              IMPORT_EXIT=$?
              echo "$IMPORT_OUTPUT"
              if [ $IMPORT_EXIT -eq 0 ]; then
                echo "✅ Provider imported successfully"
              else
                # If import fails with "already in state" error, that's actually OK
                if echo "$IMPORT_OUTPUT" | grep -q "already managed"; then
                  echo "ℹ️  Provider already managed by Terraform"
                else
                  echo "❌ Provider import failed. Error: $IMPORT_OUTPUT"
                  echo "Attempting to verify state..."
                  terraform state list | grep github_actions_provider || echo "Provider not in state"
                fi
              fi
            fi
          else
            echo "ℹ️  Provider does not exist in GCP, will be created by Terraform"
          fi

      - name: Terraform Plan
        working-directory: terraform/environments/prod
        run: terraform plan -var-file=terraform.tfvars -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/environments/prod
        run: terraform apply -auto-approve tfplan

      - name: Terraform Output
        working-directory: terraform/environments/prod
        run: terraform output

