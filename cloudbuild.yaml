steps:
  # 1. Setup Environment (based on PROJECT_ID, not branch)
  - id: "setup"
    name: "hashicorp/terraform:1.9.0"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        # Determine environment based on GCP project
        if [ "$PROJECT_ID" = "the-white-prod" ]; then
          ENV="prod"
          echo "🚀 Setting up PROD environment"
        elif [ "$PROJECT_ID" = "the-white-staging" ]; then
          ENV="staging"
          echo "🚀 Setting up STAGING environment"
        else
          ENV="dev"
          echo "🚀 Setting up DEV environment"
        fi

        cd terraform/environments/$ENV
        sh setup-env.sh

  # 2. Terraform Init
  - id: "tf-init"
    name: "hashicorp/terraform:1.9.0"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        # Determine environment based on GCP project
        if [ "$PROJECT_ID" = "the-white-prod" ]; then
          ENV="prod"
        elif [ "$PROJECT_ID" = "the-white-staging" ]; then
          ENV="staging"
        else
          ENV="dev"
        fi

        cd terraform/environments/$ENV
        terraform init

  # 3. Terraform Plan
  - id: "tf-plan"
    name: "hashicorp/terraform:1.9.0"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        # Determine environment based on GCP project
        if [ "$PROJECT_ID" = "the-white-prod" ]; then
          ENV="prod"
        elif [ "$PROJECT_ID" = "the-white-staging" ]; then
          ENV="staging"
        else
          ENV="dev"
        fi

        cd terraform/environments/$ENV
        terraform plan -out=tfplan

  # 4. Terraform Apply
  - id: "tf-apply"
    name: "hashicorp/terraform:1.9.0"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        # Determine environment based on GCP project
        if [ "$PROJECT_ID" = "the-white-prod" ]; then
          ENV="prod"
        elif [ "$PROJECT_ID" = "the-white-staging" ]; then
          ENV="staging"
        else
          ENV="dev"
        fi

        cd terraform/environments/$ENV
        terraform apply -auto-approve tfplan

options:
  logging: CLOUD_LOGGING_ONLY

# Run the build using the specific Terraform Service Account we created
serviceAccount: "projects/${PROJECT_ID}/serviceAccounts/terraform-sa@${PROJECT_ID}.iam.gserviceaccount.com"

timeout: 1200s
